name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tools/make_version.py
      - run: pyinstaller --noconfirm AlohaBOM.spec
      - name: Smoke test (headless scan on demo data)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process dist\AlohaBOM.exe -ArgumentList "--scan" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "scan failed: $($p.ExitCode)" }
          Get-Content "$env:APPDATA\AlohaBOM\history.log" -ErrorAction SilentlyContinue
      - name: Push exe to dist branch (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ls -la dist
          mkdir out && cp dist/AlohaBOM.exe dist/version.json out/
          cd out
          git init -q && git checkout -q -b dist && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: AlohaBOM-${{ github.sha }}
          path: |
            dist/AlohaBOM.exe
            dist/version.json
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AlohaBOM.exe
            dist/version.json
